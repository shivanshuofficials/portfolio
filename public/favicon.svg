<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Velvet Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#240a12" />
      <stop offset="65%" stop-color="#120508" />
      <stop offset="100%" stop-color="#0b0305" />
    </radialGradient>

    <!-- Metallic Rose Gold Linear Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f5c2c8" />
      <stop offset="55%" stop-color="#d8838e" />
      <stop offset="85%" stop-color="#b8384d" />
      <stop offset="100%" stop-color="#6e1423" />
    </linearGradient>

    <!-- Crimson Velvet Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c2c8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#d8838e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7c1626" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#d8838e" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#7c1626" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle / Rounded Diamond Monogram Frame -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#d8838e" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="8 6" />

  <!-- Monogram Logo Characters: S & C intertwined -->
  <g filter="url(#softGlow)">
    <!-- Letter S (Front Left Calligraphic Curve) -->
    <text 
      x="170" 
      y="345" 
      font-family="'Playfair Display', 'Bodoni Moda', 'Didot', 'Cinzel', serif" 
      font-size="270" 
      font-weight="600" 
      font-style="italic"
      fill="url(#roseGold)" 
      text-anchor="middle"
      letter-spacing="-0.05em">S</text>

    <!-- Letter C (Slightly Offset Right with Interlock Depth) -->
    <text 
      x="330" 
      y="350" 
      font-family="'Playfair Display', 'Bodoni Moda', 'Didot', 'Cinzel', serif" 
      font-size="270" 
      font-weight="600" 
      font-style="italic"
      fill="url(#roseGold)" 
      text-anchor="middle"
      letter-spacing="-0.05em">C</text>
  </g>

  <!-- Editorial Four-Point Sparkle ✦ in Rose Gold -->
  <path d="M 400 115 Q 400 140 425 140 Q 400 140 400 165 Q 400 140 375 140 Q 400 140 400 115 Z" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="400" cy="140" r="3" fill="#d8838e" />

  <path d="M 105 385 Q 105 400 120 400 Q 105 400 105 415 Q 105 400 90 400 Q 105 400 105 385 Z" fill="#d8838e" opacity="0.8" />
</svg>
